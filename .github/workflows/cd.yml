name: CD
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  cd:
    if: ${{ (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') || github.event_name == 'workflow_dispatch' }}
    secrets: inherit
    uses: mantit0985/.github/.github/workflows/cd.yml@main
    with:
      image_name: ${{ github.repository }}
